<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Power Law — Embed</title>


  <style>
    /* --- page reset --- */
    html, body {
      overflow: hidden !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
      background: transparent !important;
    }

    #root {
      height: 100% !important;
      width: 100% !important;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: transparent !important;
    }

    /* app wrapper clean */
    .min-h-screen {
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* center main container */
    .max-w-7xl {
      margin: 0 auto !important;
      padding: 0 !important;
      background: transparent !important;
      min-height: 0 !important;
      width: 100% !important;
      max-width: 1100px;
    }

    /* toon enkel de 1e sectie (Power Law) */
    .max-w-7xl > div:nth-of-type(2),
    .max-w-7xl > .grid {
      display: none !important;
    }

    /* ⛔ strip ALLEEN de Card-root (1e sectie -> 1e kind = <Card/>) */
    .max-w-7xl > div:first-child > * {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 0 !important;   /* eigen padding in Card weg */
      margin: 0 !important;
      width: 100%;
      max-width: 1100px;
    }

    /* KPI-kaartjes bovenaan zonder rand/kader,
       maar laat alle andere UI (sliders/switches) met rust */
    .max-w-7xl > div:first-child .grid > div {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }

    /* laat sliders/switches ongemoeid */
    .radix-slider,
    .radix-slider-thumb,
    .radix-slider-track,
    .radix-slider-range,
    [data-state][role="switch"],
    button[role="switch"] {
      all: revert !important;
    }

    header, footer { display: none !important; }
  </style>
  <script type="module" crossorigin src="/BTCwin4life/assets/main-Cn1RLA8Z.js"></script>
  <link rel="stylesheet" crossorigin href="/BTCwin4life/assets/main-B-FTXEUD.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
