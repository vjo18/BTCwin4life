<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Power Law — Embed</title>


  <style>
    /* --- page reset --- */
    html, body {
      overflow: hidden !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
      background: transparent !important;
    }

    #root {
      height: 100% !important;
      width: 100% !important;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: transparent !important;
    }

    /* remove app wrapper styling */
    .min-h-screen {
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* center container */
    .max-w-7xl {
      margin: 0 auto !important;
      padding: 0 !important;
      background: transparent !important;
      min-height: 0 !important;
      width: 100% !important;
      max-width: 1100px;
    }

    /* hide all other sections except first chart block */
    .max-w-7xl > div:nth-of-type(2),
    .max-w-7xl > .grid {
      display: none !important;
    }

    /* strip only the outer card container */
    .max-w-7xl > div:first-child {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      border-radius: 0 !important;
      margin: 0 auto !important;
      padding: 0 !important;
      width: 100%;
      max-width: 1100px;
    }

    /* ✅ restore slider UI — make sure sliders keep styles */
    .slider, [role="slider"], .radix-slider, .radix-slider-thumb, .radix-slider-track {
      all: unset !important;
      display: revert !important;
    }

    /* restore background for slider thumb (circle) */
    .radix-slider-thumb {
      background-color: #fff !important;
      border: 2px solid #0f172a !important; /* or your theme */
      border-radius: 9999px !important;
    }

    /* restore track/rail styling */
    .radix-slider-track, .radix-slider-range {
      background: #94a3b8 !important; /* slate-400 */
      height: 4px !important;
      border-radius: 9999px;
    }

    header, footer { display: none !important; }
  </style>
