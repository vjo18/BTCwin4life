<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Power Law — Embed</title>


  <style>
    html, body {
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      background: transparent !important;
      height: 100%;
    }

    #root {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100%;
      width: 100%;
      background: transparent !important;
    }

    /* remove app bg + spacing only in embed */
    .min-h-screen {
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* center container */
    .max-w-7xl {
      margin: 0 auto !important;
      padding: 0 !important;
      background: transparent !important;
      max-width: 1100px;
      width: 100% !important;
    }

    /* hide everything except first big card (powerlaw) */
    .max-w-7xl > div:nth-child(n+2),
    .max-w-7xl > .grid {
      display: none !important;
    }

    /* remove the outer card box (border/rounded/shadow) */
    .max-w-7xl > div:first-child {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      margin: 0 auto !important;
      padding: 0 !important;
      width: 100%;
      max-width: 1100px;
    }

    /* remove internal chart frame border & radius */
    /* target recharts container + panel wrapper */
    .recharts-wrapper,
    .recharts-surface,
    [class*="rounded"],
    [class*="shadow"],
    [class*="border"],
    [class*="ring"] {
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }

    /* keep slider styling (Radix) — do NOT override */
    .radix-slider,
    .radix-slider-thumb,
    .radix-slider-track,
    .radix-slider-range {
      all: revert !important;
    }

    header, footer {
      display: none !important;
    }
  </style>
