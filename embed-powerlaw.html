<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Power Law — Embed</title>


  <style>
    /* --- Page reset --- */
    html, body {
      overflow: hidden !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
      background: transparent !important;
    }

    #root {
      height: 100% !important;
      width: 100% !important;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* change to center if desired */
      background: transparent !important;
    }

    /* Remove app wrapper styling */
    .min-h-screen {
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* Center container */
    .max-w-7xl {
      margin: 0 auto !important;
      padding: 0 !important;
      background: transparent !important;
      min-height: 0 !important;
      width: 100% !important;
      max-width: 1100px;
    }

    /* --- Alleen de Power-Law sectie tonen --- */
    .max-w-7xl > div:nth-of-type(2),
    .max-w-7xl > .grid {
      display: none !important;
    }

    /* --- Buitenste kaart (grote wrapper) frame weg --- */
    .max-w-7xl > div:first-child {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      margin: 0 auto !important;
      padding: 0 !important;
      width: 100%;
      max-width: 1100px;
    }

    /* --- KPI-kaartjes in de bovenste grid zonder randen --- */
    /* (laat sliders/switches met rust) */
    .max-w-7xl > div:first-child .grid > div {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
    }

    /* --- Chart-panel kader weg (maar niet aan sliders komen) --- */
    /* vaak is er een wrapper met border/radius rond de grafiek */
    .max-w-7xl > div:first-child .recharts-wrapper,
    .max-w-7xl > div:first-child .recharts-wrapper * {
      box-shadow: none !important;
      background: transparent !important;
    }
    /* als de grafiek in een extra "panel" met border zit: */
    .max-w-7xl > div:first-child div[class*="p-"][class*="border"] {
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      background: transparent !important;
    }

    /* ❗ Geen generieke regels meer zoals [class*="rounded"] of [class*="border"] —
       zo blijven jouw switches/sliders onaangeroerd. */

    header, footer { display: none !important; }
  </style>
  <script type="module" crossorigin src="/BTCwin4life/assets/main-Cn1RLA8Z.js"></script>
  <link rel="stylesheet" crossorigin href="/BTCwin4life/assets/main-B-FTXEUD.css">
</head>

<body>
  <div id="root"></div>
</body>
</html>
